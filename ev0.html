<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파이썬 탐색 알고리즘 12가지 시각화</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f1f5f9;color:#17243b}header{background:linear-gradient(100deg,#142b57,#2455a5);color:white;padding:19px 25px}h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#dce9ff}main{display:grid;grid-template-columns:215px minmax(0,1fr);gap:16px;padding:16px;max-width:1600px;margin:auto}nav{display:flex;flex-direction:column;gap:6px}.navbtn{border:1px solid #d7dfeb;border-radius:9px;background:white;padding:11px;text-align:left;cursor:pointer;font-weight:600}.navbtn.selected{background:#1e40af;color:white}.panel{background:white;border:1px solid #dae2ee;border-radius:13px;padding:18px;margin-bottom:15px;min-width:0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:15px}h2{margin:0 0 9px;font-size:21px}h3{font-size:17px;margin:0 0 12px}#desc{color:#475569}pre{background:#111e34;color:#e4f2ff;padding:17px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.65;white-space:pre;tab-size:4}button{cursor:pointer} .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls button,#copy{background:#1d4ed8;color:white;border:0;border-radius:8px;padding:10px 13px}.controls button:hover,#copy:hover{background:#1e40af}#range{width:100%;margin:15px 0}#counter{font-weight:700;color:#1d4ed8}.board{display:flex;gap:8px;flex-wrap:wrap;min-height:85px;align-content:start}.board.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:380px}.cell{min-width:45px;min-height:52px;display:flex;align-items:center;justify-content:center;border:2px solid #cbd5e1;border-radius:8px;background:#eaf0f8;font-size:19px;font-weight:bold}.cell.visited{background:#bfdbfe;border-color:#60a5fa}.cell.active{background:#fef08a;border-color:#eab308;box-shadow:0 0 0 2px #fde68a}.cell.wall{background:#334155;color:white}#message{font-weight:bold;color:#1e40af;margin:14px 0 6px}#state{color:#475569;line-height:1.7;overflow-wrap:anywhere}#history{min-height:150px;max-height:270px;overflow:auto;background:#f8fafc;color:#334155;border:1px solid #e2e8f0}footer{padding:16px;text-align:center;color:#64748b}@media(max-width:850px){main{display:block}nav{flex-direction:row;overflow:auto;margin-bottom:15px}.navbtn{flex:0 0 175px}.columns{grid-template-columns:1fr}}@media print{nav,.controls,#range,#copy{display:none}main{display:block}.columns{grid-template-columns:1fr 1fr}pre{white-space:pre-wrap;color:black;background:#eee}header{color:black;background:white}}</style></head><body><header><h1>🔎 파이썬 탐색 알고리즘 12가지 시각화</h1><p>전체 코드 · 단계별 실행 · 탐색 과정 · 출력 로그 | 오프라인 학습자료</p></header><main><nav id="nav" aria-label="알고리즘 선택"></nav><section><div class="panel"><h2 id="title"></h2><p id="desc"></p></div><div class="columns"><div class="panel"><h3>🐍 파이썬 전체 코드</h3><button id="copy">코드 복사</button><pre id="code"></pre></div><div class="panel"><h3>📊 탐색 과정 시각화</h3><div id="board" class="board"></div><p id="message"></p><p id="state"></p><input id="range" type="range" min="0" max="1" value="0" aria-label="탐색 단계"><div class="controls"><button id="prev">◀ 이전</button><button id="play">▶ 자동 재생</button><button id="next">다음 ▶</button><button id="reset">↻ 처음</button><label>속도 <select id="speed"><option value="1300">느림</option><option value="700" selected>보통</option><option value="250">빠름</option></select></label><span id="counter"></span></div><h3 style="margin-top:24px">🖥️ 단계별 실행 기록</h3><pre id="history"></pre></div></div></section></main><footer>노란색: 현재 검사 · 파란색: 이전 방문 · ✕: 배치 불가 · ■: 벽 | Python 코드는 IDLE에서 독립 실행 가능</footer><script>const DATA=[["선형 탐색", "리스트를 앞에서부터 차례대로 검사합니다.", "a = [8, 3, 5, 1, 9, 2]\ntarget = 9\nfor i, x in enumerate(a):\n    print(\"검사\", i, x)\n    if x == target:\n        print(\"찾음\", i)\n        break", "linear"], ["이진 탐색", "정렬된 배열에서 가운데 값을 기준으로 탐색 범위를 줄입니다.", "a = [2, 5, 8, 12, 16, 23, 38]\ntarget = 16\nleft, right = 0, len(a)-1\nwhile left <= right:\n    mid = (left+right)//2\n    print(left, mid, right)\n    if a[mid] == target:\n        print(\"찾음\", mid)\n        break\n    if target < a[mid]: right = mid-1\n    else: left = mid+1", "binary"], ["재귀 이진 탐색", "재귀 호출마다 후보 구간을 절반으로 줄입니다.", "def search(a, target, left, right):\n    if left > right: return -1\n    mid = (left+right)//2\n    print(\"중간값\", a[mid])\n    if a[mid] == target: return mid\n    if target < a[mid]:\n        return search(a,target,left,mid-1)\n    return search(a,target,mid+1,right)\na = [1,3,5,7,9,11,13]\nprint(search(a,11,0,6))", "recursive"], ["깊이 우선 탐색 DFS", "한 갈래를 깊이 탐색하고 되돌아옵니다.", "graph = {\"A\":[\"B\",\"C\"],\"B\":[\"D\",\"E\"],\"C\":[\"F\"],\"D\":[],\"E\":[],\"F\":[]}\nvisited = set()\ndef dfs(v):\n    visited.add(v)\n    print(\"방문\", v)\n    for nxt in graph[v]:\n        if nxt not in visited: dfs(nxt)\ndfs(\"A\")", "dfs"], ["너비 우선 탐색 BFS", "큐를 이용해 가까운 정점부터 탐색합니다.", "from collections import deque\ngraph = {\"A\":[\"B\",\"C\"],\"B\":[\"D\",\"E\"],\"C\":[\"F\"],\"D\":[],\"E\":[],\"F\":[]}\nq = deque([\"A\"])\nvisited = {\"A\"}\nwhile q:\n    v = q.popleft()\n    print(\"방문\", v)\n    for nxt in graph[v]:\n        if nxt not in visited:\n            visited.add(nxt)\n            q.append(nxt)", "bfs"], ["스택 DFS", "재귀 대신 스택을 사용해 깊이 우선 탐색을 합니다.", "graph = {0:[1,2],1:[3,4],2:[5],3:[],4:[],5:[]}\nstack = [0]\nvisited = set()\nwhile stack:\n    v = stack.pop()\n    if v in visited: continue\n    visited.add(v)\n    print(\"방문\", v)\n    for nxt in reversed(graph[v]):\n        if nxt not in visited: stack.append(nxt)", "stack"], ["부분집합 완전탐색", "각 원소의 포함과 미포함을 모두 탐색합니다.", "nums = [1,2,3]\ndef subset(i,chosen):\n    if i == len(nums):\n        print(chosen)\n        return\n    subset(i+1,chosen+[nums[i]])\n    subset(i+1,chosen)\nsubset(0,[])", "subset"], ["순열 백트래킹", "선택과 복원을 반복하며 순열을 탐색합니다.", "nums = [1,2,3]\npath = []\ndef perm():\n    if len(path) == len(nums):\n        print(path[:])\n        return\n    for x in nums:\n        if x not in path:\n            path.append(x)\n            perm()\n            path.pop()\nperm()", "perm"], ["가지치기 부분집합 합", "양수의 합이 목표를 넘으면 탐색을 중단합니다.", "nums = [1,4,6,9]\ntarget = 10\ndef search(i,total,chosen):\n    if total == target:\n        print(\"정답\", chosen)\n        return\n    if i == len(nums) or total > target: return\n    search(i+1,total+nums[i],chosen+[nums[i]])\n    search(i+1,total,chosen)\nsearch(0,0,[])", "prune"], ["N-Queen", "같은 열과 대각선을 피하며 퀸을 배치합니다.", "N = 4\nboard = []\ndef safe(row,col):\n    return all(c != col and abs(row-r) != abs(col-c)\n               for r,c in enumerate(board))\ndef queen(row):\n    if row == N:\n        print(board[:])\n        return\n    for col in range(N):\n        if safe(row,col):\n            board.append(col)\n            queen(row+1)\n            board.pop()\nqueen(0)", "queen"], ["BFS 최단 경로", "가중치 없는 그래프의 최단 경로를 찾습니다.", "from collections import deque\ngraph = {\"A\":[\"B\",\"C\"],\"B\":[\"D\"],\"C\":[\"E\"],\"D\":[\"F\"],\"E\":[\"F\"],\"F\":[]}\nq = deque([[\"A\"]])\nseen = {\"A\"}\nwhile q:\n    path = q.popleft()\n    v = path[-1]\n    if v == \"F\":\n        print(\"최단 경로\", path)\n        break\n    for nxt in graph[v]:\n        if nxt not in seen:\n            seen.add(nxt)\n            q.append(path+[nxt])", "shortest"], ["미로 BFS", "격자의 벽을 피해 최단 경로를 찾습니다.", "from collections import deque\nmaze = [[0,0,1,0],[1,0,1,0],[0,0,0,0],[0,1,1,0]]\nstart,goal = (0,0),(3,3)\nq = deque([(start,[start])])\nseen = {start}\nwhile q:\n    (x,y),path = q.popleft()\n    if (x,y) == goal:\n        print(\"경로\",path)\n        break\n    for dx,dy in [(1,0),(-1,0),(0,1),(0,-1)]:\n        nx,ny = x+dx,y+dy\n        if 0 <= nx < 4 and 0 <= ny < 4 and maze[nx][ny] == 0 and (nx,ny) not in seen:\n            seen.add((nx,ny))\n            q.append(((nx,ny),path+[(nx,ny)]))", "maze"]];
const E = DATA.map(([title,desc,code,type])=>({title,desc,code,type}));
let current=0, steps=[], index=0, timer=null;
const $=id=>document.getElementById(id);
function add(s,active=[],visited=[],message='',state=''){steps.push({s,active,visited,message,state});}
function make(type){steps=[];
 if(type==='linear'){let a=[8,3,5,1,9,2];for(let i=0;i<a.length;i++){add(a.map(String),[i],Array.from({length:i},(_,j)=>j),`인덱스 ${i}, 값 ${a[i]} 검사`, `target = 9`);if(a[i]===9){add(a.map(String),[i],Array.from({length:i+1},(_,j)=>j),'찾음! 위치 4','결과 = 4');break}}}
 else if(type==='binary'||type==='recursive'){let a=type==='binary'?[2,5,8,12,16,23,38]:[1,3,5,7,9,11,13],target=type==='binary'?16:11,l=0,r=a.length-1;while(l<=r){let m=Math.floor((l+r)/2);add(a.map(String),[m],Array.from({length:a.length},(_,i)=>i).filter(i=>i<l||i>r),`중간값 ${a[m]}과 ${target} 비교`,`left=${l} · mid=${m} · right=${r}`);if(a[m]===target){add(a.map(String),[m],[],`찾음! 인덱스 ${m}`,`return ${m}`);break}if(target<a[m])r=m-1;else l=m+1}}
 else if(['dfs','bfs','stack','shortest'].includes(type)){let g={A:['B','C'],B:type==='shortest'?['D']:['D','E'],C:type==='shortest'?['E']:['F'],D:type==='shortest'?['F']:[],E:type==='shortest'?['F']:[],F:[]};let q=[['A',['A']]],seen=new Set(['A']),done=[];while(q.length){let [v,path]=type==='dfs'||type==='stack'?q.pop():q.shift();if(done.includes(v))continue;done.push(v);add(['A','B','C','D','E','F'],[['A','B','C','D','E','F'].indexOf(v)],done.slice(0,-1).map(x=>['A','B','C','D','E','F'].indexOf(x)),`방문: ${v}`,`방문 순서: ${done.join(' → ')}  |  ${type==='dfs'||type==='stack'?'스택':'큐'}: ${q.map(x=>x[0]).join(', ')||'비어 있음'}`);if(type==='shortest'&&v==='F'){add(['A','B','C','D','E','F'],[5],[],`최단 경로: ${path.join(' → ')}`,`간선 수: ${path.length-1}`);break}let next=g[v];if(type==='dfs'||type==='stack')next=[...next].reverse();for(let n of next){if(!seen.has(n)){seen.add(n);q.push([n,[...path,n]])}}}}
 else if(type==='subset'||type==='prune'){let nums=type==='subset'?[1,2,3]:[1,4,6,9],hits=0,visits=0;function go(i,sum,chosen){visits++;add(nums.map(String),chosen.map(x=>nums.indexOf(x)),Array.from({length:i},(_,j)=>j).filter(j=>!chosen.includes(nums[j])),`상태 ${visits}: [${chosen.join(', ')}]`, `i=${i} · 합=${sum} · 방문=${visits}`);if(type==='prune'&&sum===10){hits++;add(nums.map(String),chosen.map(x=>nums.indexOf(x)),[],`정답 ${hits}: [${chosen.join(', ')}]`,`합 = 10`);return}if(i===nums.length||type==='prune'&&sum>10){if(type==='prune'&&sum>10)add(nums.map(String),chosen.map(x=>nums.indexOf(x)),[],`✂ 가지치기: ${sum} > 10`,'더 탐색하지 않음');return}go(i+1,sum+nums[i],[...chosen,nums[i]]);go(i+1,sum,chosen)}go(0,0,[])}
 else if(type==='perm'){let nums=[1,2,3],count=0;function go(path){add(nums.map(String),path.map(x=>nums.indexOf(x)),[],`현재 순열: [${path.join(', ')}]`,`깊이 = ${path.length}`);if(path.length===3){count++;add(nums.map(String),path.map(x=>nums.indexOf(x)),[],`완성 ${count}: [${path.join(', ')}]`,'백트래킹으로 돌아감');return}for(let x of nums)if(!path.includes(x))go([...path,x])}go([])}
 else if(type==='queen'){let b=[],solutions=0;function safe(r,c){return b.every((x,i)=>x!==c&&Math.abs(r-i)!==Math.abs(c-x))}function go(r){if(r===4){solutions++;add(Array.from({length:16},(_,i)=>`${Math.floor(i/4)+1},${i%4+1}`),b.map((c,i)=>4*i+c),[],`해 ${solutions}: [${b.join(', ')}]`,'4개의 퀸 배치 성공');return}for(let c=0;c<4;c++){if(safe(r,c)){b.push(c);add(Array.from({length:16},(_,i)=>`${Math.floor(i/4)+1},${i%4+1}`),b.map((x,i)=>4*i+x),[],`퀸 배치: (${r}, ${c})`,`board = [${b.join(', ')}]`);go(r+1);b.pop()}else add(Array.from({length:16},(_,i)=>`${Math.floor(i/4)+1},${i%4+1}`),b.map((x,i)=>4*i+x),[4*r+c],`✂ (${r}, ${c}) 공격받는 칸`,'가지치기')}}go(0)}
 else if(type==='maze'){let grid=[[0,0,1,0],[1,0,1,0],[0,0,0,0],[0,1,1,0]],q=[[[0,0],[[0,0]]]],seen=new Set(['0,0']);while(q.length){let [[x,y],path]=q.shift();add(grid.flat().map(v=>v?'■':'·'),[4*x+y],path.slice(0,-1).map(([a,b])=>4*a+b),`방문 (${x}, ${y})`,`경로: ${path.map(p=>'('+p.join(',')+')').join(' → ')}`);if(x===3&&y===3){add(grid.flat().map(v=>v?'■':'·'),path.map(([a,b])=>4*a+b),[],`도착! 이동 ${path.length-1}회`,'최단 경로 탐색 성공');break}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy,k=`${a},${b}`;if(a>=0&&a<4&&b>=0&&b<4&&!grid[a][b]&&!seen.has(k)){seen.add(k);q.push([[a,b],[...path,[a,b]]])}}}}
}
function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent='▶ 자동 재생'}
function render(){let x=steps[index];$('counter').textContent=`${index+1} / ${steps.length}`;$('range').max=Math.max(0,steps.length-1);$('range').value=index;$('message').textContent=x.message;$('state').textContent=x.state;let board=$('board');board.innerHTML='';board.className=['queen','maze'].includes(E[current].type)?'board grid4':'board';x.s.forEach((v,i)=>{let d=document.createElement('div');d.className='cell'+(x.active.includes(i)?' active':'')+(x.visited.includes(i)?' visited':'')+(v==='■'?' wall':'');d.textContent=E[current].type==='queen'?(x.active.includes(i)?'♛':x.visited.includes(i)?'✕':'·'):v;board.appendChild(d)});$('history').textContent=steps.slice(0,index+1).map((t,i)=>`${String(i+1).padStart(2,'0')}. ${t.message}`).slice(-10).join('\n')}
function load(n){stop();current=n;let e=E[n];$('title').textContent=`${n+1}. ${e.title}`;$('desc').textContent=e.desc;$('code').textContent=e.code;make(e.type);index=0;render();document.querySelectorAll('.navbtn').forEach((b,i)=>b.classList.toggle('selected',i===n))}
$('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()};$('next').onclick=()=>{stop();index=Math.min(steps.length-1,index+1);render()};$('reset').onclick=()=>load(current);$('range').oninput=e=>{stop();index=Number(e.target.value);render()};$('play').onclick=()=>{if(timer){stop();return}if(index>=steps.length-1)index=0;$('play').textContent='⏸ 일시 정지';timer=setInterval(()=>{if(index>=steps.length-1){stop();return}index++;render()},Number($('speed').value))};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};
$('nav').innerHTML=E.map((e,i)=>`<button class="navbtn" data-i="${i}">${i+1}. ${e.title}</button>`).join('');document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>load(Number(b.dataset.i)));$('copy').onclick=()=>{navigator.clipboard.writeText(E[current].code).then(()=>$('copy').textContent='복사 완료').catch(()=>alert('코드를 선택하여 복사하세요'));setTimeout(()=>$('copy').textContent='코드 복사',1500)};load(0);
</script></body></html>
