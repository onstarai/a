<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pandas 101개 코드 퀴즈 — 101점 만점</title><style>body{margin:0;background:#f2f5fa;color:#16253c;font:16px/1.65 "Malgun Gothic",Arial,sans-serif}header{background:#17365c;color:white;padding:30px max(20px,calc((100% - 1100px)/2))}h1{margin:0;font-size:30px}main{max-width:1100px;margin:auto;padding:20px}.bar{position:sticky;top:0;background:white;border-bottom:1px solid #ccd7e5;padding:12px;z-index:3;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.bar select,.bar input,button{padding:9px 12px;border-radius:8px;border:1px solid #b8c7db;font:inherit}button{cursor:pointer;background:#e5eefb}.primary{background:#185a9d;color:white}.card{background:white;border:1px solid #d8e2ef;border-radius:14px;margin:18px 0;padding:22px}.meta{color:#426b98;font-weight:bold}.code{background:#102036;color:#f2f6ff;border-radius:10px;padding:16px;overflow:auto;white-space:pre-wrap;font:13px/1.55 Consolas,monospace}.output{background:#edf3f9;color:#253d56}.choices{display:grid;gap:9px}.choice{display:flex;align-items:flex-start;gap:10px;border:1px solid #d7e1ef;border-radius:8px;padding:10px;cursor:pointer}.choice:has(input:checked){background:#eaf3ff;border-color:#6c9bc9}.choice input{margin-top:6px;transform:scale(1.2)}.result{padding:12px;border-radius:9px;background:#f1f5fa;margin-top:15px}.good{color:#12643a}.bad{color:#a52c2c}.muted{color:#5d6d82}#summary{background:#fff;padding:20px;border-radius:12px;margin:15px 0}.hide{display:none!important}@media print{.bar,button{display:none!important}.card{break-inside:avoid}} </style></head><body><header><h1>Pandas 코드 분석 퀴즈 · 101문항</h1><div>각 문항의 실제 코드를 읽고 옳은 설명 4개를 선택하세요. 각 1점, 총 101점.</div></header><div class="bar"><label>영역 <select id="group"><option value="">전체 101문항</option></select></label><label>검색 <input id="search" placeholder="함수명 검색"></label><span id="progress"></span><button onclick="grade()" class="primary">전체 채점</button><button onclick="download()">성적표 TXT 저장</button><button onclick="resetAll()">답안 초기화</button></div><main><section id="summary">정답은 제출 전 공개되지 않습니다. 5개 중 정확히 4개를 선택해야 해당 문항 1점입니다. 선택하지 않은 문항은 0점입니다.</section><div id="questions"></div><button class="primary" onclick="grade()">101문항 전체 채점하기</button></main><script>const DATA=[{"id": 1, "title": "001. Series 생성", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.Series([10,20,30], index=[\"가\",\"나\",\"다\"])\nprint(result)", "output": "가    10\n나    20\n다    30\ndtype: int64", "options": ["Series는 1차원 레이블 자료구조이다", "인덱스는 자동으로 0, 1, 2만 생성된다", "가·나·다를 인덱스로 지정한다", "값은 10, 20, 30이다", "출력에는 dtype 정보가 표시된다"], "wrong": 1, "explain": "틀린 설명: 인덱스는 자동으로 0, 1, 2만 생성된다 / 올바른 해석: Series는 1차원 레이블 자료구조이다; 가·나·다를 인덱스로 지정한다; 값은 10, 20, 30이다."}, {"id": 2, "title": "002. DataFrame 생성", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.DataFrame({\"name\":[\"Kim\",\"Lee\",\"Park\"],\"score\":[90,80,95]})\nprint(result)", "output": "   name  score\n0   Kim     90\n1   Lee     80\n2  Park     95", "options": ["두 열 name과 score를 만든다", "행은 세 개이다", "별도의 인덱스를 주지 않아 0부터 시작한다", "score는 정수 데이터이다", "결과에는 age 열이 자동으로 추가된다"], "wrong": 4, "explain": "틀린 설명: 결과에는 age 열이 자동으로 추가된다 / 올바른 해석: 두 열 name과 score를 만든다; 행은 세 개이다; 별도의 인덱스를 주지 않아 0부터 시작한다."}, {"id": 3, "title": "003. date_range", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.date_range(\"2026-01-01\", periods=4, freq=\"D\")\nprint(result)", "output": "DatetimeIndex(['2026-01-01', '2026-01-02', '2026-01-03', '2026-01-04'], dtype='datetime64[ns]', freq='D')", "options": ["시작 날짜는 2026년 1월 1일이다", "periods=4는 날짜 네 개를 만든다", "마지막 날짜는 2026년 1월 5일이다", "freq=D는 일 단위이다", "반환형은 DatetimeIndex이다"], "wrong": 2, "explain": "틀린 설명: 마지막 날짜는 2026년 1월 5일이다 / 올바른 해석: 시작 날짜는 2026년 1월 1일이다; periods=4는 날짜 네 개를 만든다; freq=D는 일 단위이다."}, {"id": 4, "title": "004. read_csv", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.read_csv(StringIO(\"name,score\\nKim,90\\nLee,80\"))\nprint(result)", "output": "  name  score\n0  Kim     90\n1  Lee     80", "options": ["CSV의 쉼표는 행 구분자로 사용된다", "StringIO는 문자열을 파일처럼 읽게 한다", "첫 줄은 열 이름으로 해석된다", "데이터 행은 두 개이다", "score 열에는 90과 80이 들어간다"], "wrong": 0, "explain": "틀린 설명: CSV의 쉼표는 행 구분자로 사용된다 / 올바른 해석: StringIO는 문자열을 파일처럼 읽게 한다; 첫 줄은 열 이름으로 해석된다; 데이터 행은 두 개이다."}, {"id": 5, "title": "005. read_json", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.read_json(StringIO('{\"name\":{\"0\":\"Kim\"},\"score\":{\"0\":90}}'))\nprint(result)", "output": "  name  score\n0  Kim     90", "options": ["JSON 문자열을 DataFrame으로 읽는다", "name 열에 Kim이 들어간다", "score 열에 90이 들어간다", "JSON을 읽으면 무조건 Series만 반환된다", "StringIO를 통해 문자열을 전달한다"], "wrong": 3, "explain": "틀린 설명: JSON을 읽으면 무조건 Series만 반환된다 / 올바른 해석: JSON 문자열을 DataFrame으로 읽는다; name 열에 Kim이 들어간다; score 열에 90이 들어간다."}, {"id": 6, "title": "006. json_normalize", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.json_normalize([{\"id\":1,\"info\":{\"city\":\"Seoul\"}}])\nprint(result)", "output": "   id info.city\n0   1     Seoul", "options": ["중첩된 info의 city를 펼친다", "중첩 객체는 자동으로 삭제되어 city 값도 사라진다", "결과 열 이름에 info.city가 등장한다", "id 값은 1이다", "결과는 한 행이다"], "wrong": 1, "explain": "틀린 설명: 중첩 객체는 자동으로 삭제되어 city 값도 사라진다 / 올바른 해석: 중첩된 info의 city를 펼친다; 결과 열 이름에 info.city가 등장한다; id 값은 1이다."}, {"id": 7, "title": "007. to_csv", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.to_csv(index=False)\nprint(result)", "output": "name,score,age,city\nKim,90,17.0,Seoul\nLee,80,18.0,Busan\nPark,95,17.0,Seoul\nChoi,85,,Incheon\n", "options": ["index=False로 인덱스 열을 제외한다", "CSV 헤더에는 name과 score가 있다", "문자열로 CSV 결과를 얻는다", "결측 age는 빈 필드로 표현된다", "index=False는 name 열도 제거한다"], "wrong": 4, "explain": "틀린 설명: index=False는 name 열도 제거한다 / 올바른 해석: index=False로 인덱스 열을 제외한다; CSV 헤더에는 name과 score가 있다; 문자열로 CSV 결과를 얻는다."}, {"id": 8, "title": "008. to_json", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.to_json(orient=\"records\", force_ascii=False)\nprint(result)", "output": "[{\"name\":\"Kim\",\"score\":90,\"age\":17.0,\"city\":\"Seoul\"},{\"name\":\"Lee\",\"score\":80,\"age\":18.0,\"city\":\"Busan\"},{\"name\":\"Park\",\"score\":95,\"age\":17.0,\"city\":\"Seoul\"},{\"name\":\"Choi\",\"score\":85,\"age\":null,\"city\":\"Incheon\"}]", "options": ["orient=records는 행별 객체 목록을 만든다", "force_ascii=False는 비ASCII 문자 이스케이프를 억제한다", "반환값은 NumPy ndarray이다", "결측 age는 JSON null로 나타난다", "각 행에 name 키가 포함된다"], "wrong": 2, "explain": "틀린 설명: 반환값은 NumPy ndarray이다 / 올바른 해석: orient=records는 행별 객체 목록을 만든다; force_ascii=False는 비ASCII 문자 이스케이프를 억제한다; 결측 age는 JSON null로 나타난다."}, {"id": 9, "title": "009. to_dict", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.to_dict(orient=\"records\")\nprint(result)", "output": "[{'name': 'Kim', 'score': 90, 'age': 17.0, 'city': 'Seoul'}, {'name': 'Lee', 'score': 80, 'age': 18.0, 'city': 'Busan'}, {'name': 'Park', 'score': 95, 'age': 17.0, 'city': 'Seoul'}, {'name': 'Choi', 'score': 85, 'age': nan, 'city': 'Incheon'}]", "options": ["결과의 최상위 자료형은 DataFrame이다", "orient=records는 행별 딕셔너리 목록이다", "첫 행의 name은 Kim이다", "리스트에는 네 개의 딕셔너리가 있다", "age의 결측은 Python nan으로 남을 수 있다"], "wrong": 0, "explain": "틀린 설명: 결과의 최상위 자료형은 DataFrame이다 / 올바른 해석: orient=records는 행별 딕셔너리 목록이다; 첫 행의 name은 Kim이다; 리스트에는 네 개의 딕셔너리가 있다."}, {"id": 10, "title": "010. to_numpy", "group": "생성·입출력", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.to_numpy()\nprint(result)", "output": "[['Kim' 90 17.0 'Seoul']\n ['Lee' 80 18.0 'Busan']\n ['Park' 95 17.0 'Seoul']\n ['Choi' 85 nan 'Incheon']]", "options": ["DataFrame을 NumPy 배열로 변환한다", "배열은 네 행 네 열이다", "문자열과 숫자가 섞여 object dtype이 될 수 있다", "반환 배열에 DataFrame 열 레이블이 별도 축으로 보존된다", "배열 값에 Kim이 포함된다"], "wrong": 3, "explain": "틀린 설명: 반환 배열에 DataFrame 열 레이블이 별도 축으로 보존된다 / 올바른 해석: DataFrame을 NumPy 배열로 변환한다; 배열은 네 행 네 열이다; 문자열과 숫자가 섞여 object dtype이 될 수 있다."}, {"id": 11, "title": "011. head", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.head(2)\nprint(result)", "output": "  name  score   age   city\n0  Kim     90  17.0  Seoul\n1  Lee     80  18.0  Busan", "options": ["head(2)는 앞의 두 행을 선택한다", "Park 행이 반드시 포함된다", "Kim 행이 포함된다", "Lee 행이 포함된다", "원래 열 네 개가 유지된다"], "wrong": 1, "explain": "틀린 설명: Park 행이 반드시 포함된다 / 올바른 해석: head(2)는 앞의 두 행을 선택한다; Kim 행이 포함된다; Lee 행이 포함된다."}, {"id": 12, "title": "012. tail", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.tail(2)\nprint(result)", "output": "   name  score   age     city\n2  Park     95  17.0    Seoul\n3  Choi     85   NaN  Incheon", "options": ["tail(2)는 마지막 두 행을 선택한다", "Park 행이 포함된다", "Choi 행이 포함된다", "기존 인덱스 2와 3이 유지된다", "선택된 행의 인덱스는 자동으로 0과 1로 재설정된다"], "wrong": 4, "explain": "틀린 설명: 선택된 행의 인덱스는 자동으로 0과 1로 재설정된다 / 올바른 해석: tail(2)는 마지막 두 행을 선택한다; Park 행이 포함된다; Choi 행이 포함된다."}, {"id": 13, "title": "013. sample", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.sample(n=2, random_state=42)\nprint(result)", "output": "   name  score   age     city\n1   Lee     80  18.0    Busan\n3  Choi     85   NaN  Incheon", "options": ["n=2로 두 행을 표본 추출한다", "random_state=42로 재현 가능한 표본을 만든다", "random_state는 추출할 행을 점수 내림차순으로 정렬한다", "표본은 원본 DataFrame에서 뽑는다", "추출된 행의 기존 인덱스가 유지된다"], "wrong": 2, "explain": "틀린 설명: random_state는 추출할 행을 점수 내림차순으로 정렬한다 / 올바른 해석: n=2로 두 행을 표본 추출한다; random_state=42로 재현 가능한 표본을 만든다; 표본은 원본 DataFrame에서 뽑는다."}, {"id": 14, "title": "014. info", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.info()\nprint(result)", "output": "<class 'pandas.core.frame.DataFrame'>\nRangeIndex: 4 entries, 0 to 3\nData columns (total 4 columns):\n #   Column  Non-Null Count  Dtype  \n---  ------  --------------  -----  \n 0   name    4 non-null      object \n 1   score   4 non-null      int64  \n 2   age     3 non-null      float64\n 3   city    4 non-null      object \ndtypes: float64(1), int64(1), object(2)\nmemory usage: 260.0+ bytes\n", "options": ["info의 반환값은 요약 통계 DataFrame이다", "info는 열별 non-null 개수를 보여준다", "age의 non-null 개수는 3이다", "자료형 요약이 표시된다", "info는 화면에 정보를 출력하고 None을 반환한다"], "wrong": 0, "explain": "틀린 설명: info의 반환값은 요약 통계 DataFrame이다 / 올바른 해석: info는 열별 non-null 개수를 보여준다; age의 non-null 개수는 3이다; 자료형 요약이 표시된다."}, {"id": 15, "title": "015. describe", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"scor oul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.loc[df.score >= 85, [\"name\",\"score\"]]\nprint(result)", "output": "   name  score\n0   Kim     90\n2  Park     95\n3  Choi     85", "options": ["loc는 레이블 기반 선택이다", "score가 85 이상인 행을 고른다", "선택 열은 name과 score이다", "85점인 Choi도 제외된다", "Lee는 조건에 맞지 않는다"], "wrong": 3, "explain": "틀린 설명: 85점인 Choi도 제외된다 / 올바른 해석: loc는 레이블 기반 선택이다; score가 85 이상인 행을 고른다; 선택 열은 name과 score이다."}, {"id": 21, "title": "021. iloc", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.iloc[:2, :2]\nprint(result)", "output": "  name  score\n0  Kim     90\n1  Lee     80", "options": ["iloc는 정수 위치 기반이다", "슬라이스 끝 위치 2도 포함한다", ":2는 0과 1 위치를 포함한다", "앞의 두 열만 선택한다", "결과는 2행 2열이다"], "wrong": 1, "explain": "틀린 설명: 슬라이스 끝 위치 2도 포함한다 / 올바른 해석: iloc는 정수 위치 기반이다; :2는 0과 1 위치를 포함한다; 앞의 두 열만 선택한다."}, {"id": 22, "title": "022. at", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.at[0,\"score\"]\nprint(result)", "output": "90", "options": ["at는 행·열 레이블로 단일 값을 찾는다", "행 레이블 0을 사용한다", "열 이름 score를 사용한다", "결과는 90이다", "at[0,\"score\"]는 첫 행 전체를 반환한다"], "wrong": 4, "explain": "틀린 설명: at[0,\"score\"]는 첫 행 전체를 반환한다 / 올바른 해석: at는 행·열 레이블로 단일 값을 찾는다; 행 레이블 0을 사용한다; 열 이름 score를 사용한다."}, {"id": 23, "title": "023. iat", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [1 ], "wrong": 2, "explain": "틀린 설명: 최저 점수 Lee가 첫 번째이다 / 올바른 해석: nlargest는 큰 값부터 n개를 고른다; score 열을 기준으로 한다; Park가 첫 번째이다."}, {"id": 29, "title": "029. nsmallest", "group": "조회·선택", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.nsmallest(2,\"score\")\nprint(result)", "output": "   name  score   age     city\n1   Lee     80  18.0    Busan\n3  Choi     85   NaN  Incheon", "options": ["Park가 첫 번째이다", "nsmallest는 작은 값부터 n개를 고른다", "score 열을 기준으로 한다", "Lee가 첫 번째이다", "Choi가 두 번째이다"], "wrong": 0, "explain": "틀린 설명: Park가 첫 번째이다 / 올바른 해석: nsmallest는 작은 값부터 n개를 고른다; score 열을 기준으로 한다; Lee가 첫 번째이다."}, {"id": 30, "title": "030. assign", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.assign(bonus=df.score+5)\nprint(result)", "output": "   name  score   age     city  bonus\n0   Kim     90  17.0    Seoul     95\n1   Lee     80  18.0    Busan     85\n2  Park     95  17.0    Seoul    100\n3  Choi     85   NaN  Incheon     90", "options": ["assign은 새 열을 추가한 DataFrame을 반환한다", "추가 열 이름은 bonus이다", "bonus는 score+5이다", "기존 score 열이 삭제된다", "Park의 bonus는 100이다"], "wrong": 3, "explain": "틀린 설명: 기존 score 열이 삭제된다 / 올바른 해석: assign은 새 열을 추가한 DataFrame을 반환한다; 추가 열 이름은 bonus이다; bonus는 score+5이다."}, {"id": 31, "title": "031. rename", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.rename(columns={\"score\":\"점수\"})\nprint(result)", "output": "   name  점수   age     city\n0   Kim  90  17.0    Seoul\n1   Lee  80  18.0    Busan\n2  Park  95  17.0    Seoul\n3  Choi  85   NaN  Incheon", "options": ["rename은 열 레이블을 바꾼다", "rename은 모든 점수를 문자열로 변환한다", "score가 점수로 바뀐다", "기존 값 90은 유지된다", "원본을 기본적으로 직접 수정하지 않는다"], "wrong": 1, "explain": "틀린 설명: rename은 모든 점수를 문자열로 변환한다 / 올바른 해석: rename은 열 레이블을 바꾼다; score가 점수로 바뀐다; 기존 값 90은 유지된다."}, {"id": 32, "title": "032. drop", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.drop(columns=\"city\")\nprint(result)", "output": "   name  score   age\n0   Kim     90  17.0\n1   Lee     80  18.0\n2  Park     95  17.0\n3  Choi     85   NaN", "options": ["drop(columns=city)는 city 열을 제거한다", "name은 남는다", "score는 남는다", "행은 네 개 그대로이다", "city 값이 Seoul인 행만 삭제한다"], "wrong": 4, "explain": "틀린 설명: city 값이 Seoul인 행만 삭제한다 / 올바른 해석: drop(columns=city)는 city 열을 제거한다; name은 남는다; score는 남는다."}, {"id": 33, "title": "033. drop_duplicates", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.drop_duplicates(subset=\"city\")\nprint(result)", "output": "   name  score   age     city\n0   Kim     90  17.0    Seoul\n1   Lee     80  18.0    Busan\n3  Choi     85   NaN  Incheon", "options": ["drop_duplicates는 중복을 제거한다", "중복 판단 기준은 city이다", "Seoul의 마지막 행 Park를 기본적으로 남긴다", "Seoul의 첫 행 Kim을 남긴다", "Park 행은 제외된다"], "wrong": 2, "explain": "틀린 설명: Seoul의 마지막 행  [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.set_index(\"name\")\nprint(result)", "output": "      score   age     city\nname                      \nKim      90  17.0    Seoul\nLee      80  18.0    Busan\nPark     95  17.0    Seoul\nChoi     85   NaN  Incheon", "options": ["set_index는 지정한 열을 인덱스로 삼는다", "score 열이 새 인덱스가 된다", "name이 인덱스가 된다", "기본 drop=True로 name은 일반 열에서 빠진다", "Kim은 행 레이블이 된다"], "wrong": 1, "explain": "틀린 설명: score 열이 새 인덱스가 된다 / 올바른 해석: set_index는 지정한 열을 인덱스로 삼는다; name이 인덱스가 된다; 기본 drop=True로 name은 일반 열에서 빠진다."}, {"id": 37, "title": "037. reset_index", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.set_index(\"name\").reset_index()\nprint(result)", "output": "   name  score   age     city\n0   Kim     90  17.0    Seoul\n1   Lee     80  18.0    Busan\n2  Park     95  17.0    Seoul\n3  Choi     85   NaN  Incheon", "options": ["reset_index는 인덱스를 열로 되돌린다", "name이 일반 열로 복원된다", "새 기본 정수 인덱스가 생성된다", "행 수는 네 개로 유지된다", "reset_index는 모든 데이터 행을 삭제한다"], "wrong": 4, "explain": "틀린 설명: reset_index는 모든 데이터 행을 삭제한다 / 올바른 해석: reset_index는 인덱스를 열로 되돌린다; name이 일반 열로 복원된다; 새 기본 정수 인덱스가 생성된다."}, {"id": 38, "title": "038. astype", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.astype({\"score\":\"float64\"})\nprint(result)", "output": "   name  score   age     city\n0   Kim   90.0  17.0    Seoul\n1   Lee   80.0  18.0    Busan\n2  Park   95.0  17. .DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.score.apply(lambda x: \"합격\" if x>=85 else \"보충\")\nprint(result)", "output": "0    합격\n1    보충\n2    합격\n3    합격\nName: score, dtype: object", "options": ["apply는 각 점수에 함수를 적용한다", "95점 Park는 보충이다", "85 이상은 합격이다", "80점 Lee는 보충이다", "결과는 문자열 Series이다"], "wrong": 1, "explain": "틀린 설명: 95점 Park는 보충이다 / 올바른 해석: apply는 각 점수에 함수를 적용한다; 85 이상은 합격이다; 80점 Lee는 보충이다."}, {"id": 42, "title": "042. pipe", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.pipe(lambda d: d.assign(double=d.score*2))\nprint(result)", "output": "   name  score   age     city  double\n0   Kim     90  17.0    Seoul     180\n1   Lee     80  18.0    Busan     160\n2  Park     95  17.0    Seoul     190\n3  Choi     85   NaN  Incheon     170", "options": ["pipe는 DataFrame을 함수에 전달한다", "lambda의 d는 입력 DataFrame이다", "double 열은 score의 두 배이다", "Park의 double은 190이다", "pipe는 항상 데이터 행을 한 개로 축약한다"], "wrong": 4, "explain": "틀린 설명: pipe는 항상 데이터 행을 한 개로 축약한다 / 올바른 해석: pipe는 DataFrame을 함수에 전달한다; lambda의 d는 입력 DataFrame이다; double 열은 score의 두 배이다."}, {"id": 43, "title": "043. explode", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.DataFrame({\"x\":[[1,2],[3]]}).explode(\"x\")\nprint(result)", "output": "   x\n0  1\n0  2\n1  3", "options": ["explode는 리스트 원소를 행으로 펼친다", "첫 리스트 [1,2]는 두 행이 된다", "explode는 각 리스트를 한 개의 문자열로 합친다", "두 번째 리스트 [3]은 한 행이다", "인덱스가 중복될 수 있다"], "wrong": 2, "explain": "틀린 설명: explode는 각 리스트를 한 개의 문자열로 합친다 / 올바른 해석: explode는 리스트 원소를 행으로 펼친다; 첫 리스트 [1,2]는 두 행이 된다; 두 번째 리스트 [3]은 한 행이다."}, {"id": 44, "title": "044. melt", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.melt(id_vars=\"name\", value_vars=[\"score\",\"age\"])\nprint(result)", "output": "   name variable  value\n0   Kim    score   90.0\n1   Lee    score   80.0\n2  Park    score   95.0\n3  Choi    score   85.0\n4   Kim      age   17.0\n5   Lee      age   18.0\n6  Park      age   17.0\n7  Choi      age    NaN", "options": ["melt 후 score와 age는 그대로 별개의 가로 열이다", "melt는 넓은 데이터를 긴 형태로 만든다", "name은 식별 열이다", "score와 age를 세로로 펼친다", "variable과 value 열이 생성된다"], "wrong": 0, "explain": "틀린 설명: melt 후 score와 age는 그대로 별개의 가로 열이다 / 올바른 해석: melt는 넓은 데이터를 긴 형태로 만든다; name은 식별 열이다; score와 age를 세로로 펼친다."}, {"id": 45, "title": "045. pivot", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.pivot(index=\"name\",columns=\"city\",values=\"score\")\nprint(result)", "output": "city  Busan  Incheon  Seoul\nname                       \nChoi    NaN     85.0    NaN\nKim     NaN      NaN   90.0\nLee    80.0      NaN    NaN\nPark    NaN      NaN   95.0", "options": ["pivot은 행과 열로 재구성한다", "name이 행 인덱스이다", "city가 열 방향 범주이다", "존재하지 않는 조합은 NaN이 될 수 있다|pivot은 city별 평균을 자동 계산한다", "score가 셀 값이다"], "wrong": 3, "explain": "틀린 설명: 존재하지 않는 조합은 NaN이 될 수 있다|pivot은 city별 평균을 자동 계산한다 / 올바른 해석: pivot은 행과 열로 재구성한다; name이 행 인덱스이다; city가 열 방향 범주이다."}, {"id": 46, "title": "046. get_dummies", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.get_dummies(df.city, dtype=int)\nprint(result)", "output": "   Busan  Incheon  Seoul\n0      0        0      1\n1      1        0      0\n2      0        0      1\n3      0        1      0", "options": ["get_dummies는 범주를 지시 열로 변환한다", "각 도시 이름을 원본에서 삭제하고 점수 평균을 구한다", "Seoul 범주에 대응하는 열이 생긴다", "dtype=int로 0과 1을 쓴다", "행 수는 원본과 같다"], "wrong": 1, "explain": "틀린 설명: 각 도시 이름을 원본에서 삭제하고 점수 평균을 구한다 / 올바른 해석: get_dummies는 범주를 지시 열로 변환한다; Seoul 범주에 대응하는 열이 생긴다; dtype=int로 0과 1을 쓴다."}, {"id": 47, "title": "047. cut", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.cut(df.score,bins=[0,80,90,100],include_lowest=True)\nprint(result)", "output": "0      (80.0, 90.0]\n1    (-0.001, 80.0]\n2     (90.0, 100.0]\n3      (80.0, 90.0]\nName: score, dtype: category\nCategories (3, interval[float64, right]): [(-0.001, 80.0] < (80.0, 90.0] < (90.0, 100.0]]", "options": ["cut은 수치 구간을 지정한 경계로 나눈다", "경계는 0,80,90,100이다", "include_lowest=True는 첫 구간의 왼쪽 경계를 포함한다", "결과는 범주형 구간 Series이다", "cut은 구간마다 관측 수가 같도록 경계를 자동 조절한다"], "wrong": 4, "explain": "틀린 설명: cut은 구간마다 관측 수가 같도록 경계를 자동 조절한다 / 올바른 해석: cut은 수치 구간을 지정한 경계로 나눈다; 경계는 0,80,90,100이다; include_lowest=True는 첫 구간의 왼쪽 경계를 포함한다."}, {"id": 48, "title": "048. qcut", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = pd.qcut(df.score,q=2,duplicates=\"drop\")\nprint(result)", "output": "0      (87.5, 95.0]\n1    (79.999, 87.5]\n2      (87.5, 95.0]\n3    (79.999, 87.5]\nName: score, dtype: category\nCategories (2, interval[float64, right]): [(79.999, 87.5] < (87.5, 95.0]]", "options": ["qcut은 분위수를 기준으로 구간을 나눈다", "q=2는 두 분위 구간을 요청한다", "qcut은 bins=[0,80,90,100] 경계를 그대로 사용한다", "score를 기준으로 구간화한다", "duplicates=drop은 중복 경계 문제를 처리한다"], "wrong": 2, "explain": "틀린 설명: qcut은 bins=[0,80,90,100] 경계를 그대로 사용한다 / 올바른 해석: qcut은 분위수를 기준으로 구간을 나눈다; q=2는 두 분위 구간을 요청한다; score를 기준으로 구간화한다."}, {"id": 49, "title": "049. rank", "group": "정리·변환", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.score.rank(ascending=False)\nprint(result)", "output": "0    2.0\n1    4.0\n2    1.0\n3    3.0\nName: score, dtype: float64", "options": ["rank는 점수를 무작위로 섞는다", "rank는 값의 순위를 계산한다", "ascending=False는 높은 점수에 작은 순위를 준다", "Park의 순위는 1이다", "Lee의 순위는 4이다"], "wrong": 0, "explain": "틀린 설명: rank는 점수를 무작위로 섞는다 / 올바른 해석: rank는 값의 순위를 계산한다; ascending=False는 높은 점수에 작은 순위를 준다; Park의 순위는 1이다."}, {"id": 50, "title": "050. isna", "group": "결측치·문자열", "code": "import pandas as pd\nfrom io import StringIO\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"name\": [\"Kim\", \"Lee\", \"Park\", \"Choi\"],\n    \"score\": [90, 80, 95, 85],\n    \"age\": [17, 18, 17, np.nan],\n    \"city\": [\"Seoul\", \"Busan\", \"Seoul\", \"Incheon\"]\n})\n\nresult = df.isna().sum()\nprint(result)", "output": "name     0\nscore    0\nage      1\ncity     0\ndtype: int64", "options $('questions');root.innerHTML=DATA.map(q=>`<article class="card" data-group="${esc(q.group)}" data-title="${esc(q.title.toLowerCase())}"><div class="meta">문항 ${q.id} / 101 · ${esc(q.group)} · 1점</div><h2>${esc(q.title)}</h2><p>다음 코드의 실행과 관련하여 <b>옳은 설명 4개를 모두 선택</b>하세요.</p><pre class="code">${esc(q.code)}</pre><div class="choices">${q.options.map((t,j)=>`<label class="choice"><input type="checkbox" data-id="${q.id}" data-j="${j}" ${((answers[q.id]||[]).includes(j))?'checked':''}><span><b>${'①②③④⑤'[j]}</b> ${esc(t)}</span></label>`).join('')}</div><div class="result ${graded?'':'hide'}" id="result${q.id}"></div><details><summary>원본 자료의 실행 결과 보기 (학습용)</summary><pre class="code output">${esc(q.output)}</pre></details></article>`).join('');root.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{const id=+el.dataset.id,j=+el.dataset.j;let a=answers[id]||[];if(el.checked){if(a.length>=4){el.checked=false;alert('옳은 보기 4개까지만 선택할 수 있습니다.');return}a.push(j)}else a=a.filter(x=>x!==j);answers[id]=a;graded=false;root.querySelectorAll('.result').forEach(x=>x.classList.add('hide'));update()}));filter();update()}function update(){const done=DATA.filter(q=>(answers[q.id]||[]).length===4).length;$('progress').textContent=`4개 선택 완료: ${done}/101`;}function filter(){const g=$('group').value,t=$('search').value.toLowerCase();document.querySelectorAll('.card').forEach(e=>e.classList.toggle('hide',!!(g&&e.dataset.group!==g||t&&!e.dataset.title.includes(t))))}function grade(){graded=true;let score=0;DATA.forEach(q=>{const a=answers[q.id]||[],ok=a.length===4&&!a.includes(q.wrong);if(ok)score++;const el=$('result'+q.id);el.classList.remove('hide');el.innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'정답 · 1점':'오답 · 0점'}</strong><div>정답: ${[0,1,2,3,4].filter(j=>j!==q.wrong).map(j=>'①②③④⑤'[j]).join(', ')} / 틀린 보기: ${'①②③④⑤'[q.wrong]}</div><div>${esc(q.explain)}</div>`});$('summary').innerHTML=`<h2>채점 결과: ${score} / 101점</h2><p>정답 ${score}문항 · 오답 또는 미응답 ${101-score}문항 · 정확히 네 개를 모두 선택해야 1점</p><p>각 문항 아래 정오답과 해설이 표시되었습니다.</p>`;window.scrollTo({top:0,behavior:'smooth'});return score}function download(){const score=grade();const stamp=new Date().toLocaleString('sv-SE').replace(/[ :]/g,'-');const student=prompt('학번_이름 (선택 사항)','')||'미입력';const text=`Pandas 101문항 평가\n응시자: ${student}\n점수: ${score}/101\n응시시각: ${new Date().toLocaleString('ko-KR')}\n\n`+DATA.map(q=>`문항 ${q.id} ${q.title} | 선택 ${((answers[q.id]||[]).map(j=>'①②③④⑤'[j]).join(','))||'미응답'} | 정답 ${[0,1,2,3,4].filter(j=>j!==q.wrong).map(j=>'①②③④⑤'[j]).join(',')} | ${((answers[q.id]||[]).length===4&&!(answers[q.id]||[]).includes(q.wrong))?'1':'0'}점`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=`${student}_${score}점_Pandas_${stamp}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function resetAll(){if(confirm('모든 답안을 초기화할까요?')){Object.keys(answers).forEach(k=>delete answers[k]);graded=false;$('summary').textContent='정답은 제출 전 공개되지 않습니다. 5개 중 옳은 설명 4개를 모두 선택하세요.';render()}}$('group').addEventListener('change',filter);$('search').addEventListener('input',filter);render();</script></body></html>
